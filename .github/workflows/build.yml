name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_ID: antigravity-coding-filter

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test plugin and release packaging helper
        run: go test ./... ./.github/scripts

      - name: Test release publishing
        run: bash .github/scripts/publish-release_test.sh

      - name: Vet
        run: go vet ./... ./.github/scripts

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN_ID}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w" \
              -o "dist/${LIB_NAME}" .
          rm -f "dist/${PLUGIN_ID}.h"

      - name: Package plugin
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -library "dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-windows-arm64:
    name: Build windows/arm64
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_windows_arm64.zip" >> "${GITHUB_ENV}"

      - name: Build Windows ARM64 shared library
        timeout-minutes: 45
        run: |
          set -euo pipefail
          sudo snap install zig --classic --beta
          sudo tee /usr/local/bin/zcc >/dev/null <<'EOF'
          #!/bin/sh
          exec zig cc -target aarch64-windows-gnu "$@"
          EOF
          sudo tee /usr/local/bin/z++ >/dev/null <<'EOF'
          #!/bin/sh
          exec zig c++ -target aarch64-windows-gnu "$@"
          EOF
          sudo chmod +x /usr/local/bin/zcc /usr/local/bin/z++
          mkdir -p dist/windows-arm64
          CGO_ENABLED=1 \
            GOOS=windows \
            GOARCH=arm64 \
            CC=zcc \
            CXX=z++ \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w" \
              -o "dist/windows-arm64/${PLUGIN_ID}.dll" .

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "dist/windows-arm64/${PLUGIN_ID}.h"
          go run ./.github/scripts/package-release.go \
            -library "dist/windows-arm64/${PLUGIN_ID}.dll" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-freebsd:
    name: Build freebsd/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_freebsd_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Prepare inputs for the FreeBSD VM
        run: |
          set -euo pipefail
          staging="dist/freebsd-${{ matrix.goarch }}"
          archive="$(go env GOVERSION).freebsd-${{ matrix.goarch }}.tar.gz"
          destination="${staging}/go.tar.gz"
          curl_options=(--fail --silent --show-error --location --connect-timeout 20
                        --max-time 180 --retry 3 --retry-max-time 240)
          checksum="$(curl "${curl_options[@]}" 'https://go.dev/dl/?mode=json&include=all' |
            jq -er --arg archive "${archive}" '.[] | .files[] | select(.filename == $archive) | .sha256')"
          mkdir -p "${staging}"
          curl "${curl_options[@]}" "https://go.dev/dl/${archive}" --output "${destination}"
          printf '%s  %s\n' "${checksum}" "${destination}" | sha256sum --strict --check
          module_cache="$(mktemp -d)"
          GOMODCACHE="${module_cache}" go mod download
          mv "${module_cache}/cache/download" "${staging}/module-proxy"
          git archive --format=tar HEAD > "${staging}/source.tar"
          source_checksum="$(sha256sum "${staging}/source.tar" | cut -d ' ' -f 1)"
          echo "FREEBSD_SOURCE_SHA256=${source_checksum}" >> "${GITHUB_ENV}"

      - name: Test and build in the FreeBSD VM
        timeout-minutes: 45
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: '14.4'
          arch: x86_64
          sync: rsync
          envs: PLUGIN_ID FREEBSD_SOURCE_SHA256
          run: |
            set -eu
            toolchain="$(mktemp -d)"
            source_dir="$(mktemp -d)"
            staging="${PWD}/dist/freebsd-${{ matrix.goarch }}"
            test "$(sha256 -q "${staging}/source.tar")" = "${FREEBSD_SOURCE_SHA256}"
            tar -xf "${staging}/source.tar" -C "${source_dir}"
            tar -xzf "${staging}/go.tar.gz" -C "${toolchain}"
            export PATH="${toolchain}/go/bin:${PATH}"
            export GOTOOLCHAIN=local CGO_ENABLED=1
            export GOPROXY="file://${staging}/module-proxy"
            cd "${source_dir}"
            test "$(go env GOOS)/$(go env GOARCH)" = 'freebsd/${{ matrix.goarch }}'
            go test -mod=readonly ./... ./.github/scripts
            go build -mod=readonly -trimpath -buildmode=c-shared \
              -ldflags "-s -w" \
              -o "${staging}/${PLUGIN_ID}.so" .

      - name: Package plugin
        run: |
          set -euo pipefail
          library="dist/freebsd-${{ matrix.goarch }}/${PLUGIN_ID}.so"
          metadata="$(go version -m "${library}")"
          grep -F 'GOOS=freebsd' <<< "${metadata}"
          grep -F 'GOARCH=${{ matrix.goarch }}' <<< "${metadata}"
          go run ./.github/scripts/package-release.go \
            -library "${library}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  verify-artifacts:
    name: Verify build artifacts
    needs:
      - build
      - build-windows-arm64
      - build-freebsd
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify archives and checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=0.0.0-dev
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          targets=(linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64 freebsd_amd64)
          archives=(*.zip)
          checksums=(*.zip.sha256)
          if (( ${#archives[@]} != ${#targets[@]} || ${#checksums[@]} != ${#targets[@]} )); then
            echo "Expected ${#targets[@]} archives and checksums, found ${#archives[@]} archives and ${#checksums[@]} checksums" >&2
            exit 1
          fi
          for target in "${targets[@]}"; do
            case "${target%%_*}" in
              darwin) ext=dylib ;;
              windows) ext=dll ;;
              *) ext=so ;;
            esac
            archive="${PLUGIN_ID}_${version}_${target}.zip"
            sha256sum --text "${archive}" | diff - "${archive}.sha256"
            unzip -tq "${archive}"
            if [[ "$(unzip -Z1 "${archive}")" != "${PLUGIN_ID}.${ext}" ]]; then
              echo "${archive} must contain only ${PLUGIN_ID}.${ext}" >&2
              exit 1
            fi
          done

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-release.sh
